services:
  redis:
    image: redis:alpine
    container_name: netguard-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
  postgres:
    image: postgres:latest
    container_name: netguard-postgres
    environment:
      POSTGRES_USER: netguard
      POSTGRES_PASSWORD: netguard
      POSTGRES_DB: netguard
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
