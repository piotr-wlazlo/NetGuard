server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Analiza przyjmuje JSON do 5 MB (limit z interfejsu), z zapasem
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Upload PCAP: większy limit i przesyłanie strumieniowe prosto do backendu (bez buforowania w nginx)
    location = /api/v1/analysis/pcap {
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Zapytania do API trafiają do kontenera backendu (to samo origin, bez CORS)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Pliki z hashem w nazwie (build Vite) można cache'ować długo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routing po stronie przeglądarki (React Router): nieznane ścieżki -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
